# Local dev database only. Prod is Hostinger's MySQL/MariaDB (SPEC D-38); files live on disk.
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_USER: vault
      MARIADB_PASSWORD: vault
      MARIADB_DATABASE: vault
      MARIADB_ROOT_PASSWORD: vault
    ports:
      # 3307 on the host so it never clashes with a locally installed MySQL.
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # Creates the disposable test database next to the dev one.
      - ./scripts/dev-db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  dbdata:
